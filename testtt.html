<head>

<style>
.parent :first-child{
    color: aquamarine;
}
.parent :last-child{
    color: blueviolet;
}
.parent :nth-child(2){
    color: brown;
}
.parent :nth-child(3){
    color: cornflowerblue;
}
</style>
<body>
    <div class="parent">
        <h3>Child1</h3>
        <h3>Child2</h3>
        <h3>Child3</h3>
        <h3>Child4</h3>
    </div>
    <form action="">
        <select name="" id="">
            <option disabled value="">Select Gender</option>
            <option value="">Male</option>
            <option selected value="">Female</option>
            <input checkedB type="checkbox">
        </select>
    </form>
</body>
</html>
