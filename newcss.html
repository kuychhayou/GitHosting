<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .cover{
            width: 100%;
            height: 100vh;
            background-image: url(https://i.pinimg.com/1200x/b6/1d/42/b61d42f8c38e5aec3dd3d83139ee9766.jpg);
            background-position: center;
            background-size: cover;
            padding: 30px 500px;
        }
        .form{
            width: 500px;
            height: 600px;
            /* box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px; */
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .form h3{
            text-align: center;
            color: cornflowerblue;
            font-size: 50px;
            /* font-family: "Caacupe One", sans-serif; */
        }
        .form label{
            font-size: 26px;
            color: dodgerblue;
        }
        .form input{
            width: 100%;
            height: 50px;
            border-style: none;
            border-radius: 15px;
            outline-color: deepskyblue;
            padding: 15px;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
        }
        .form select{
            width: 100%;
            height: 40px;
            /* margin-top: 40px; */
            border-style: none;
            border-radius: 15px;
            outline-color: lightblue;
            outline-style: groove;
        }
        .btn{
            width: 100%;
            height: 40px;
            margin-top: 40px;
            border-style: none;
            border-radius: 15px;
            background-color: steelblue;
            outline-color: skyblue;
            color: rgb(246, 247, 251);
        }
    </style>
<body>
    <div class="cover">
        <from class="form" action="">
            <h3>Register account</h3>
            <label>Username</label><br>
            <input type="text" placeholder="Enter your name:"><br>
            <label>Email</label><br>
            <input type="text" placeholder="Enter your email:"><br>
            <label>Password</label><br>
            <input type="password" placeholder="Enter your password:"><br>
            <label>Gender:</label>
            <select>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
            <button class="btn">Submit</button>
        </from>
    </div>
</body>
</html>
