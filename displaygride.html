<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-columns: repeat(3,200px);
        /* grid-template-rows: repeat(3,300px); */
        gap: 10px; /*similar like margin */
        grid-auto-rows: 300px;
    }

    .parent div{
        background-color: cornflowerblue;
        font-size: 30px;
        text-align: center;
        color: lightgoldenrodyellow;
    }
    .parent :first-child{
        grid-column: span 3;
    }
    .parent :nth-child(2){
        grid-row: span 2;
    }

</style>
<body>
    <div class="parent">
        <div>child1</div>
        <div>child2</div>
        <div>child3</div>
        <div>child4</div>
        <div>child5</div>
        <div>child6</div>
    </div>
</body>
</html>
