<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    nav{
        width: 100%;
        height: 100px;
        display: flex;
        box-shadow: rgba(0,0,0,0.35)0px 5px 15px;
    }
    .logo{
        width: 40%;
        height: 100%;
        display: flex;
        justify-content: left;
        align-items: center;
    }
    .logo img{
        width: 250px;
        height: 100px;
        object-fit: cover;
    }
    .option{
        width: 60%;
        height: 100%;
        display: flex;
    }
    .home{
        width: 20%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        gap: 5px;
    }
    .about{
        width: 20%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        gap: 5px;
    }
    .skill{
        width: 20%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        font-size: 30px;
    }
    .project{
        width: 20%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        gap: 5px;
    }
    .login{
        width: 20%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .login button{
        width: 80%;
        height: 50%;
        border-style: none;
        border-radius: 5px;
        font-size: 25px;
        box-shadow: rgba(0,0,0,0.35)0px 5px 15px;
    }
</style>
<body>
    <nav>
        <div class="logo">
            <img src="https://press.asus.com/assets/w_854,h_640/e2c84986-7e34-40e3-8fa2-4053d3f17187/ASUS%20logo%20grey.png" alt="">
        </div>
        <div class="option">
            <div class="home">
                <span style="font-size: 35px;" class="material-symbols-outlined">
                home
                </span>
                <span>Home</span>
            </div>
            <div class="about">
                <span style="font-size: 35px;" class="material-symbols-outlined">
                contact_phone
                </span>
                <span>About</span>
            </div>
            <div class="skill">
                <span style="font-size: 35px;" class="material-symbols-outlined">
                downhill_skiing
                </span>
                <span>Skill</span>
            </div>
            <div class="project">
                <span style="font-size: 35px;" class="material-symbols-outlined">
                car_fan_recirculate
                </span>
                <span>Project</span>
            </div>
            <div class="login">
                <button>Login</button>
            </div>
        </div>
    </nav>
</body>
</html>
