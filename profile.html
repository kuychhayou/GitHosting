<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            box-sizing: border-box;
        }
        .profile-control{
            width: 500px;
            height: 500px;
            box-shadow: rgba(0,0,0,0.35) 0px 5px 15px;
            margin: 10px;
            border-radius: 50%;
            /* padding: 100px 100px; */
        }
        .profile{
            width:100%;
            height: 100%;
            background-color: brown;
            position: relative;
            border-radius: 50%;
        }
        .profile img{
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: rgba(100,100,111,0.2) 0px 7px 29px 0px;
        }
        .online{
            width: 70px;
            height: 70px;
            background-color: green;
            position: absolute;
            right: 50px;
            bottom: 30px;
            border-radius: 50%;
            border: 3px solid white;
        }
    </style>
</head>
<body>
    <div class="profile-control">
        <div class="profile">
            <img src="../Image/36b18e0ecec762d6775c81c445e2cd60.jpg">
            <div class="online"></div>
        </div>
    </div>
</body>
</html>
